name: Lunes Auto Login (Proxy)
on:
  schedule:
    - cron: "0 2 */6 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          chmod +x scripts/setup_proxy.sh
          bash scripts/setup_proxy.sh

      - name: Run login (proxy + 账号密码)
        env:
          ACCOUNTS_BATCH: ${{ secrets.ACCOUNTS_BATCH }}
          # IS_PROXY / PROXY_SERVER 由上一步通过 $GITHUB_ENV 自动注入，无需在此重复声明
        run: python login_proxy.py

      - name: 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: Upload screenshots as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit timestamp
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          git diff --cached --quiet || (git commit -m "run $(date +'%Y-%m-%d %H:%M')" && git push)
